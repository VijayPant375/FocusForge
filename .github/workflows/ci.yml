name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Job 1: verify every service installs cleanly ──────────────────────────
  install:
    name: Install dependencies
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - api-gateway
          - user-service
          - habit-service
          - analytics-service
          - ai-service
          - notification-service
          - frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ matrix.service }}/package-lock.json

      - name: Install ${{ matrix.service }}
        working-directory: ${{ matrix.service }}
        run: npm ci

  # ── Job 2: verify every Dockerfile builds successfully ────────────────────
  docker-build:
    name: Docker Compose build
    runs-on: ubuntu-latest
    needs: install          # only run if all installs passed
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create placeholder .env for compose
        # docker compose build only needs the variable names present, not real values
        run: |
          cat <<'EOF' > .env
          JWT_SECRET=ci-placeholder
          USER_DB_URI=mongodb://localhost:27017/ci-users
          HABIT_DB_URI=mongodb://localhost:27017/ci-habits
          GEMINI_API_KEY=ci-placeholder
          GEMINI_MODEL=gemini-2.5-flash
          USER_SERVICE_URL=http://user-service:5001
          HABIT_SERVICE_URL=http://habit-service:5002
          ANALYTICS_SERVICE_URL=http://analytics-service:5003
          AI_SERVICE_URL=http://ai-service:5004
          EOF

      - name: Build all service images
        run: docker compose build --parallel
