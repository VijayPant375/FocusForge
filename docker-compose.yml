version: '3.8'
services:
  mongodb:
    image: mongo:7.0
    ports: ["27017:27017"]
    volumes: [mongodb_data:/data/db]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
  user-service:
    build: ./user-service
    ports: ["5001:5001"]
    environment:
      - PORT=5001
      - MONGODB_URI=${USER_DB_URI}
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      mongodb:
        condition: service_healthy
  habit-service:
    build: ./habit-service
    ports: ["5002:5002"]
    environment:
      - PORT=5002
      - MONGODB_URI=${HABIT_DB_URI}
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      mongodb:
        condition: service_healthy
  analytics-service:
    build: ./analytics-service
    ports: ["5003:5003"]
    environment:
      - PORT=5003
      - MONGODB_URI=${HABIT_DB_URI}
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      mongodb:
        condition: service_healthy
  ai-service:
    build: ./ai-service
    ports: ["5004:5004"]
    environment:
      - PORT=5004
      - MONGODB_URI=${HABIT_DB_URI}
      - JWT_SECRET=${JWT_SECRET}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
    depends_on:
      mongodb:
        condition: service_healthy
  notification-service:
    build: ./notification-service
    ports: ["5005:5005"]
    environment:
      - PORT=5005
      - JWT_SECRET=${JWT_SECRET}
      - MONGODB_URI=${HABIT_DB_URI}
      - HABIT_SERVICE_URL=http://habit-service:5002
    depends_on:
      mongodb:
        condition: service_healthy
  api-gateway:
    build: ./api-gateway
    ports: ["5000:5000"]
    environment:
      - PORT=5000
      - USER_SERVICE_URL=${USER_SERVICE_URL}
      - HABIT_SERVICE_URL=${HABIT_SERVICE_URL}
      - ANALYTICS_SERVICE_URL=${ANALYTICS_SERVICE_URL}
      - AI_SERVICE_URL=${AI_SERVICE_URL}
      - NOTIFICATION_SERVICE_URL=http://notification-service:5005
    depends_on: [user-service, habit-service, analytics-service, ai-service, notification-service]
  frontend:
    build: ./frontend
    ports: ["5173:80"]
    depends_on: [api-gateway]
volumes:
  mongodb_data:

