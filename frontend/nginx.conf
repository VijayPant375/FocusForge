server {
  listen 80;

  # Proxy API calls to the api-gateway container (Docker internal DNS)
  # Using a variable prevents nginx from crashing on startup if the host is missing (e.g. on Render)
  location /api/ {
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $upstream_api api-gateway;
    proxy_pass http://$upstream_api:5000/api/;
    
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 30s;
    proxy_connect_timeout 10s;
  }

  location / {
    root /usr/share/nginx/html;
    index index.html;
    try_files $uri $uri/ /index.html;
  }
}
